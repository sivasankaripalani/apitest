# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "feature" ]
  pull_request:
    branches: [ "feature" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  portal:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name : checkout
        uses: actions/checkout@v4

      

      - name: Find Relative Directory Paths of Specific File perfectly  working code 
        run: |
          BASE_DIR="base"  # Change this to your base directory
          SPECIFIC_FILE="new.json"  # Change this to your specific file name

          echo "Searching for '$SPECIFIC_FILE' in directories under '$BASE_DIR':"

          # Use find to search for the specific file and print its directory paths
          DIR_PATHS=$(find "$BASE_DIR" -type f -name "$SPECIFIC_FILE" -exec dirname {} \; | sort -u)

          if [ -z "$DIR_PATHS" ]; then
            echo "No directories found containing '$SPECIFIC_FILE'."
            echo "DIR_PATHS=" >> $GITHUB_ENV  # Set an empty env variable
          else
            echo "Found directories:"
            echo "$DIR_PATHS" | while read -r DIR_PATH; do
              echo "Directory path: $DIR_PATH"
              # Zip the specific file in each directory
              ZIP_NAME="$(basename "$DIR_PATH").zip"
              zip -qq -r "$ZIP_NAME" "$DIR_PATH"
              echo "Created zip file: $ZIP_NAME"
              unzip -qq "$ZIP_NAME" -d static-portal
              ls static-portal
            done
          fi

