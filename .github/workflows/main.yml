# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "feature" ]
  pull_request:
    branches: [ "feature" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  portal:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name : checkout
        uses: actions/checkout@v4

      # Runs a single command using the runners shell

      - name: Find Paths Relative to Specific File
        run: |
          SPECIFIC_FILE="new.json"  # Change this to your specific file
          
          if [ -f "$SPECIFIC_FILE" ]; then
            echo "Finding paths relative to $SPECIFIC_FILE"
            
            # Get the directory of the specific file
            DIR_PATH=$(dirname "$SPECIFIC_FILE")

            # Find all directories relative to the specific file's directory
            find "$DIR_PATH" -type d | sed "s|^$DIR_PATH/||"  # Remove the base path to get relative paths
          else
            echo "File $SPECIFIC_FILE does not exist."
          fi

