# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "feature" ]
  pull_request:
    branches: [ "feature" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  portal:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name : checkout
        uses: actions/checkout@v4

      - name: Find Relative Directory Paths of Specific File
        run: |
          BASE_DIR="base"  # Change this to your base directory
          SPECIFIC_FILE="new.json"  # Change this to your specific file name

          echo "Searching for '$SPECIFIC_FILE' in directories under '$BASE_DIR':"

          # Use find to search for the specific file and print its directory paths
          find "$BASE_DIR" -type f -name "$SPECIFIC_FILE" -exec dirname {} \; | sed "s|^$BASE_DIR/||" | sort -u | while read DIR_PATH; do
            echo "Found directory path: $DIR_PATH"
          done

